name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio
          pip install ./packages/prodl-core

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: prodl:ci

      - name: Smoke test container
        run: |
          docker run -d --name prodl -p 8000:8000 prodl:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | tee /dev/stderr | grep -q '"status"'
          curl -fsS http://127.0.0.1:8000/ | grep -qi "ProDL"
          docker rm -f prodl

  android:
    name: Android shell (unit tests + per-ABI APKs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify split APKs (per ABI assets, libs, versionCode)
        run: |
          python3 - <<'PY'
          import json, os, re, sys, zipfile

          # Derive the expected versionCodes from the build script instead of
          # hardcoding them: every release bumps `baseVersionCode`, and a stale
          # literal here fails the build for no reason. abi -> base * 10 + abiCode
          gradle = open("app/build.gradle.kts").read()
          base = int(re.search(r"^val baseVersionCode = (\d+)", gradle, re.M).group(1))
          block = re.search(r"val abiVersionCodes = linkedMapOf\((.*?)\)", gradle, re.S).group(1)
          abi_codes = {abi: int(code) for abi, code in re.findall(r'"([\w-]+)" to (\d+)', block)}
          expected = {abi: base * 10 + code for abi, code in abi_codes.items()}
          if len(expected) != 4:
              sys.exit(f"could not read abiVersionCodes from build.gradle.kts: {expected}")
          required = [
              "assets/frontend/index.html",
              "assets/frontend/js/api.js",
              "assets/frontend/js/app.js",
              "assets/frontend/js/config.js",
              "assets/frontend/css/styles.css",
          ]
          out = "app/build/outputs/apk/debug"
          codes = {}
          with open(os.path.join(out, "output-metadata.json")) as fh:
              for element in json.load(fh)["elements"]:
                  filters = element.get("filters") or []
                  if filters and filters[0]["filterType"] == "ABI":
                      codes[filters[0]["value"]] = element["versionCode"]

          problems = []
          for abi, version_code in expected.items():
              apk = os.path.join(out, f"app-{abi}-debug.apk")
              if not os.path.isfile(apk):
                  problems.append(f"{abi}: missing {apk}")
                  continue
              names = zipfile.ZipFile(apk).namelist()
              missing = [p for p in required if p not in names]
              if missing:
                  problems.append(f"{abi}: missing shared frontend assets {missing}")
              libs = sorted({n.split("/")[1] for n in names if n.startswith("lib/")})
              if libs != [abi]:
                  problems.append(f"{abi}: native libs are {libs}, expected only [{abi}]")
              if codes.get(abi) != version_code:
                  problems.append(f"{abi}: versionCode {codes.get(abi)} != {version_code}")
              print(f"{os.path.basename(apk)}: {os.path.getsize(apk) / 1e6:.1f} MB, "
                    f"libs={libs}, versionCode={codes.get(abi)}, SPA present={not missing}")

          if problems:
              sys.exit("split APK problems:\n" + "\n".join(problems))
          PY

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: prodl-android-arm64-v8a
          path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: prodl-android-armeabi-v7a
          path: android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: prodl-android-x86_64
          path: android/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: prodl-android-x86
          path: android/app/build/outputs/apk/debug/app-x86-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodl-android-test-report
          path: android/app/build/reports/tests/
