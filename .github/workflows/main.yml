name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio
          pip install ./packages/prodl-core

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: prodl:ci

      - name: Smoke test container
        run: |
          docker run -d --name prodl -p 8000:8000 prodl:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | tee /dev/stderr | grep -q '"status"'
          curl -fsS http://127.0.0.1:8000/ | grep -qi "ProDL"
          docker rm -f prodl

  android:
    name: Android shell (unit tests + debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify the APK ships the shared SPA
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          apk = glob.glob("app/build/outputs/apk/debug/*.apk")[0]
          names = zipfile.ZipFile(apk).namelist()
          required = [
              "assets/frontend/index.html",
              "assets/frontend/js/api.js",
              "assets/frontend/js/app.js",
              "assets/frontend/js/config.js",
              "assets/frontend/css/styles.css",
          ]
          missing = [p for p in required if p not in names]
          if missing:
              sys.exit(f"APK is missing shared frontend assets: {missing}")
          print(f"{apk}: {len(names)} entries, shared SPA present")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prodl-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodl-android-test-report
          path: android/app/build/reports/tests/
