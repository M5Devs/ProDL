# One service: the backend serves the API *and* the static SPA, so there is no
# cross-origin setup to maintain. Point a desktop/Android WebView at the same
# origin, or serve ./frontend separately with ?api=http://<host>:<port>.
services:
  prodl:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: prodl:latest
    ports:
      - "${PRODL_PUBLISH_PORT:-8000}:8000"
    environment:
      # "*" keeps the SPA usable from file:// WebViews; set an explicit list
      # (e.g. "http://localhost:3000") to lock the API down.
      PRODL_CORS_ORIGINS: "${PRODL_CORS_ORIGINS:-*}"
      PRODL_SERVE_FRONTEND: "1"
      PRODL_MAX_WORKERS: "${PRODL_MAX_WORKERS:-4}"
      # Opt-in yt-dlp remote components (downloads code, off by default):
      # PRODL_YTDLP_REMOTE_COMPONENTS: "ejs:github"
    volumes:
      - prodl-data:/data
    restart: unless-stopped

volumes:
  prodl-data:
